<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Did I? — Logo &amp; app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FFF6EA; color: #17142A; font-family: 'DM Sans', system-ui, sans-serif; padding: 72px 80px; display: flex; flex-direction: column; gap: 64px">

<div style="display: flex; gap: 72px; align-items: center">
<div style="width: 360px; height: 360px; border-radius: 82px; background: {{brand}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<svg width="360" height="360" viewBox="0 0 100 100" role="img" aria-label="Did I? app icon: a question mark whose dot is a check"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFD23F"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#17142A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
</div>

<div style="display: flex; flex-direction: column; gap: 28px">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 1.2px; color: #5C5670">LOGO · APP ICON</span>
<div style="display: flex; align-items: center; gap: 22px">
<div style="width: 104px; height: 104px; border-radius: 24px; background: {{brand}}; display: flex; align-items: center; justify-content: center">
<svg width="104" height="104" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFD23F"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#17142A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 112px; line-height: 1; font-weight: 800; letter-spacing: -4px">Did I?</span>
</div>
<p style="margin: 0; font-size: 26px; font-weight: 600; max-width: 640px; line-height: 1.3">The question, already answered. A question mark whose dot is a check — tap once, stop wondering.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 8px 14px 8px 8px; font-size: 14px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 12px; background: #6B3BFF"></span>Violet #6B3BFF</span>
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 8px 14px 8px 8px; font-size: 14px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFD23F"></span>Sun #FFD23F</span>
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 8px 14px 8px 8px; font-size: 14px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 12px; background: #17142A"></span>Ink #17142A</span>
<span style="display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 8px 14px 8px 8px; font-size: 14px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFF6EA; border: 1px solid #D9D4EA; box-sizing: border-box"></span>Cream #FFF6EA</span>
</div>
</div>
</div>

<div style="display: flex; gap: 40px; align-items: flex-end">

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<div style="width: 150px; height: 150px; border-radius: 34px; background: #FFD23F">
<svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Icon on Sun yellow"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#17142A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#6B3BFF"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
</div>
<span style="font-size: 14px; font-weight: 700; color: #5C5670">Sun</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<div style="width: 150px; height: 150px; border-radius: 34px; background: #17142A">
<svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Icon on Ink, dark mode"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFF6EA" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFD23F"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#17142A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
</div>
<span style="font-size: 14px; font-weight: 700; color: #5C5670">Dark</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<div style="width: 150px; height: 150px; border-radius: 34px; background: #FFFFFF">
<svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Icon on white"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#6B3BFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#2FD4A7"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#17142A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
</div>
<span style="font-size: 14px; font-weight: 700; color: #5C5670">Light</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<div style="width: 150px; height: 150px; border-radius: 34px; background: #2A1670; display: flex; align-items: center; justify-content: center">
<div style="width: 92px; height: 92px; border-radius: 46px; background: rgba(255,255,255,0.18)">
<svg width="92" height="92" viewBox="0 0 100 100" role="img" aria-label="Monochrome glyph for Lock Screen widgets"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFFFFF"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#2A1670" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
</div>
</div>
<span style="font-size: 14px; font-weight: 700; color: #5C5670">Lock Screen glyph</span>
</div>

<div style="width: 2px; height: 150px; background: #D9D4EA; margin: 0 8px 34px"></div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 24px; align-items: flex-end; height: 150px">
<div style="width: 120px; height: 120px; border-radius: 27px; background: {{brand}}"><svg width="120" height="120" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFD23F"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#17142A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></div>
<div style="width: 76px; height: 76px; border-radius: 17px; background: {{brand}}"><svg width="76" height="76" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFD23F"></circle><path d="M42.5 87.5l5 5L58 82" fill="none" stroke="#17142A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></div>
<div style="width: 44px; height: 44px; border-radius: 10px; background: {{brand}}"><svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(10 5.4) scale(0.8)"><path d="M34 36a16 16 0 1 1 22 15c-5 2-6 6-6 11" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="50" cy="87" r="15" fill="#FFD23F"></circle></g></svg></div>
</div>
<span style="font-size: 14px; font-weight: 700; color: #5C5670">Small sizes · the check drops out at 44 px</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#6B3BFF","options":["#6B3BFF","#FF7A59","#17142A","#2FD4A7"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { brand: this.props.brand ?? '#6B3BFF' };
  }
}
</script>
</body>
</html>
