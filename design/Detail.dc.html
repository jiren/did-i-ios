<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Did I? — Front door history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B22E0}a:hover{color:#2E0FA8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6EA; color: #17142A; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="background: #6B3BFF; color: #FFFFFF; padding: 60px 24px 24px; border-radius: 0 0 36px 36px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<button aria-label="Remove this check" style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: rgba(255,255,255,0.18); color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
Remove
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600; color: #E3DAFF">Front door</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -1px">Locked at {{latestTime}}</h1>
<span style="font-size: 15px; font-weight: 600; color: #E3DAFF">{{latestAgo}}</span>
</div>
<div role="img" aria-label="Photo placeholder: the locked door, taken at 8:42 AM" style="height: 116px; border-radius: 22px; background: #2A1670; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #E3DAFF">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 14px; font-weight: 600">[Photo of locked door · 8:42 AM]</span>
</div>
</div>

<div style="margin: 16px 20px 0; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 12px 10px 16px">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #FFD23F; color: #17142A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4"></path></svg>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Nudge me when I leave home</span><span style="font-size: 13px; color: #5C5670">Only if it isn’t logged yet</span></span>
<button role="switch" aria-checked="{{remindChecked}}" aria-label="Nudge me when I leave home" onClick="{{toggleRemind}}" style="{{remindTrack}}"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span></button>
</div>

<div style="padding: 18px 24px 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 750">History</h2>
<span style="font-size: 14px; font-weight: 600; color: #5C5670">{{count}} logs</span>
</div>
<sc-for list="{{history}}" as="h" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; align-items: stretch">
<div style="display: flex; flex-direction: column; align-items: center; width: 14px">
<span style="{{h.dotStyle}}"></span>
<span style="flex-grow: 1; width: 2px; background: #D9D4EA"></span>
</div>
<div style="flex-grow: 1; padding-bottom: 14px; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{h.when}}</span><span style="font-size: 14px; color: #5C5670">{{h.how}}</span></div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 28px">
<button onClick="{{logAgain}}" style="width: 100%; height: 64px; border-radius: 32px; border: none; background: #17142A; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #FFD23F; color: #17142A; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
Log it again
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      remind: true,
      count: 47,
      history: [
        { when: 'Today, 8:42 AM', how: 'Action Button · photo' },
        { when: 'Yesterday, 10:58 PM', how: 'Lock Screen widget' },
        { when: 'Yesterday, 8:37 AM', how: 'Action Button · photo' }
      ],
      latestTime: '8:42 AM',
      latestAgo: 'Today · 2 hours ago'
    };
  }
  renderVals() {
    var self = this;
    var history = this.state.history.slice(0, 3).map(function (h, i) {
      return {
        when: h.when, how: h.how,
        dotStyle: 'width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; margin-top: 4px; ' + (i === 0 ? 'background: #6B3BFF;' : 'border: 3px solid #6B3BFF;')
      };
    });
    var on = this.state.remind;
    return {
      history: history,
      count: this.state.count,
      latestTime: this.state.latestTime,
      latestAgo: this.state.latestAgo,
      remindChecked: on ? 'true' : 'false',
      remindTrack: 'width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; flex-shrink: 0; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#6B3BFF' : '#B9B2CC') + ';',
      toggleRemind: function () { self.setState({ remind: !self.state.remind }); },
      logAgain: function () {
        var s = self.state;
        self.setState({
          history: [{ when: 'Today, just now', how: 'In the app' }].concat(s.history),
          count: s.count + 1,
          latestTime: '10:51 AM',
          latestAgo: 'Today · just now'
        });
      }
    };
  }
}
</script>
</body>
</html>
