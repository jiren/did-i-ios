<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Did I? — Action Button setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B22E0}a:hover{color:#2E0FA8}
button{font:inherit;cursor:pointer}
input[type=radio]{accent-color:#6B3BFF;width:22px;height:22px;margin:0;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6EA; color: #17142A; font-family: 'DM Sans', system-ui, sans-serif; padding: 60px 20px 28px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; border-radius: 22px; background: #17142A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<span style="font-size: 15px; font-weight: 700; color: #5C5670">Settings</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -1px">Action Button</h1>
<p style="margin: 0; font-size: 15px; color: #5C5670">One press logs it. Pick what a press does.</p>
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 700; color: #5C5670; letter-spacing: 0.6px; padding: 0 0 8px">A PRESS LOGS</legend>
<sc-for list="{{options}}" as="opt" hint-placeholder-count="5">
<label style="{{opt.rowStyle}}">
<input type="radio" name="action-button" checked="{{opt.checked}}" onChange="{{opt.pick}}">
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<span style="font-size: 16px; font-weight: 700">{{opt.label}}</span>
<span style="font-size: 13px; color: #5C5670">{{opt.hint}}</span>
</span>
<span style="{{opt.swatch}}"></span>
</label>
</sc-for>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #5C5670; letter-spacing: 0.6px">AFTER A PRESS</span>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 12px 10px 16px">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">Open camera</span><span style="font-size: 13px; color: #5C5670">Snap proof right away</span></span>
<button role="switch" aria-checked="{{cameraChecked}}" aria-label="Open camera after a press" onClick="{{toggleCamera}}" style="{{cameraTrack}}"><span style="{{cameraKnob}}"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 12px 10px 16px">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">Strong haptic</span><span style="font-size: 13px; color: #5C5670">Feel it, so you don’t doubt it</span></span>
<button role="switch" aria-checked="{{hapticChecked}}" aria-label="Strong haptic after a press" onClick="{{toggleHaptic}}" style="{{hapticTrack}}"><span style="{{hapticKnob}}"></span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'ask', camera: false, haptic: true };
  }
  renderVals() {
    var self = this;
    var defs = [
      { id: 'ask', label: 'Ask me which', hint: 'Quick picker of your checks', color: '#17142A' },
      { id: 'door', label: 'Front door locked', hint: 'Logs straight away', color: '#6B3BFF' },
      { id: 'pill', label: 'Pill taken', hint: 'Logs straight away', color: '#FFD23F' },
      { id: 'stove', label: 'Stove off', hint: 'Logs straight away', color: '#FF7A59' },
      { id: 'plug', label: 'Iron unplugged', hint: 'Logs straight away', color: '#2FD4A7' }
    ];
    var mode = this.state.mode;
    var options = defs.map(function (d) {
      var on = d.id === mode;
      return {
        label: d.label, hint: d.hint, checked: on,
        rowStyle: 'display: flex; align-items: center; gap: 14px; min-height: 60px; box-sizing: border-box; padding: 10px 16px; border-radius: 18px; cursor: pointer; background: #FFFFFF; border: 2px solid ' + (on ? '#6B3BFF' : '#FFFFFF') + ';',
        swatch: 'width: 14px; height: 14px; border-radius: 7px; flex-shrink: 0; background: ' + d.color + ';',
        pick: function () { self.setState({ mode: d.id }); }
      };
    });
    function track(on) { return 'width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; flex-shrink: 0; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#6B3BFF' : '#B9B2CC') + ';'; }
    var knob = 'width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block;';
    return {
      options: options,
      cameraChecked: this.state.camera ? 'true' : 'false',
      hapticChecked: this.state.haptic ? 'true' : 'false',
      cameraTrack: track(this.state.camera), cameraKnob: knob,
      hapticTrack: track(this.state.haptic), hapticKnob: knob,
      toggleCamera: function () { self.setState({ camera: !self.state.camera }); },
      toggleHaptic: function () { self.setState({ haptic: !self.state.haptic }); }
    };
  }
}
</script>
</body>
</html>
