<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Did I? — Start from a template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B22E0}a:hover{color:#2E0FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6EA; color: #17142A; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="position: absolute; inset: 0; overflow-y: auto; padding: 56px 20px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Cancel and go back" style="width: 44px; height: 44px; border-radius: 22px; background: #17142A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">New category</h1>
<span style="width: 44px"></span>
</div>

<p style="margin: 0; font-size: 16px; color: #5C5670">Start from a template</p>

<sc-for list="{{sections}}" as="section" hint-placeholder-count="6">
<div role="group" aria-label="{{section.title}}" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #5C5670; letter-spacing: 0.6px">{{section.label}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{section.items}}" as="item" hint-placeholder-count="4">
<a href="NewCategory.dc.html" style="background: #FFFFFF; color: #17142A; border-radius: 22px; padding: 14px; box-sizing: border-box; min-height: 132px; display: flex; flex-direction: column; gap: 10px; text-decoration: none">
<span style="display: flex; align-items: flex-start; justify-content: space-between; gap: 4px">
<span style="{{item.badgeStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.path}}"></path></svg></span>
<sc-if value="{{item.isAdded}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 700; color: #5C5670; background: #EDE6D8; border-radius: 999px; padding: 4px 8px">Added</span>
</sc-if>
</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; line-height: 1.1">{{item.name}}</span>
<span style="font-size: 13px; color: #5C5670">{{item.detail}}</span>
</a>
</sc-for>
</div>
</div>
</sc-for>

<a href="NewCategory.dc.html" style="min-height: 56px; border-radius: 20px; border: 2.5px dashed #B9B2CC; box-sizing: border-box; color: #4B22E0; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Start from scratch
</a>
</div>
</div>
</x-dc>
