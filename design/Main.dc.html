<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Did I? — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B22E0}a:hover{color:#2E0FA8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6EA; color: #17142A; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden">

<div onScroll="{{onScroll}}" style="position: absolute; inset: 0; overflow-y: auto; padding-bottom: 120px">

<div style="padding: 60px 24px 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center">
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #5C5670">{{dateLabel}}</p>
<a href="ActionButton.dc.html" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; background: #17142A; color: #FFF6EA; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"></path></svg>
</a>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; line-height: 0.95; font-weight: 800; letter-spacing: -1.5px">Did I?</h1>
</div>

<div role="group" aria-label="Pick a day" style="padding: 18px 20px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{strip}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.aria}}" style="{{d.style}}">
<span style="font-size: 12px; font-weight: 700">{{d.wk}}</span>
<span style="{{d.numStyle}}">{{d.num}}</span>
<span style="display: flex; gap: 3px; height: 6px">
<sc-for list="{{d.dots}}" as="dot" hint-placeholder-count="1"><span style="{{dot.style}}"></span></sc-for>
</span>
</button>
</sc-for>
</div>

<div role="group" aria-label="Filter by category" style="padding: 14px 20px 0; display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">
<sc-if value="{{f.hasIcon}}" hint-placeholder-val="{{ false }}">
<span style="{{f.iconStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg></span>
</sc-if>
{{f.label}}
</button>
</sc-for>
<a href="NewCategory.dc.html" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; border: 2px dashed #B9B2CC; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
New category
</a>
</div>

<div ref="{{sentinelRef}}" aria-hidden="true" style="height: 0"></div>
<div style="{{barWrapStyle}}">
<div role="status" aria-live="polite" style="{{bar.style}}">
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: {{bar.scopeColor}}">{{bar.scope}}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.15">{{bar.main}}</span>
</div>
<span style="{{bar.pillStyle}}">
<sc-if value="{{bar.clear}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
{{bar.pill}}
</span>
</div>
<sc-if value="{{bar.hasSegs}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="display: flex; gap: 3px; margin-top: 10px">
<sc-for list="{{bar.segs}}" as="sg" hint-placeholder-count="6"><span style="{{sg.style}}"></span></sc-for>
</div>
</sc-if>
</div>
</div>

<div style="padding: 10px 20px 0; display: flex; flex-direction: column; gap: 26px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
<section aria-label="{{sec.name}}" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="{{sec.iconStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sec.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 750; line-height: 1.1">{{sec.name}}</h2>
<span style="font-size: 13px; font-weight: 600; color: #5C5670">{{sec.repeat}}</span>
</div>
<span style="font-size: 14px; font-weight: 700; background: #FFFFFF; padding: 6px 10px; border-radius: 999px">{{sec.progress}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
<div style="position: relative; display: flex">
<button onClick="{{item.log}}" aria-label="{{item.aria}}" style="{{item.tileStyle}}">
<span style="position: relative; display: flex">
<span style="{{item.iconStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg></span>
<sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: -5px; bottom: -4px; width: 17px; height: 17px; border-radius: 9px; background: #17142A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; box-sizing: border-box">
<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</sc-if>
</span>
<span style="margin-top: auto; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 750; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{item.name}}</span>
<span style="{{item.subStyle}}">{{item.short}}</span>
</button>
<sc-if value="{{item.canSnap}}" hint-placeholder-val="{{ true }}">
<button onClick="{{item.snap}}" aria-label="{{item.photoAria}}" style="position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
<span style="{{item.camStyle}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<sc-if value="{{item.photo}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 6px; background: #FFD23F; border: 2px solid #17142A; box-sizing: border-box"></span>
</sc-if>
</span>
</button>
</sc-if>
</div>
</sc-for>
<button onClick="{{sec.add}}" aria-label="{{sec.addLabel}}" style="width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; border: 2px dashed #B9B2CC; background: #FFFFFF; color: #17142A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; font-family: inherit">
<span style="{{sec.addIconStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 13px; font-weight: 700">Add task</span>
</button>
</div>
</section>
</sc-for>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 750">Nothing due</span>
<span style="font-size: 15px; color: #5C5670">{{emptyText}}</span>
</div>
</sc-if>

<button onClick="{{openSheet}}" style="height: 56px; border-radius: 20px; border: 2.5px dashed #B9B2CC; background: transparent; color: #4B22E0; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add checks
</button>

<sc-if value="{{hasUpcoming}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 750">Coming up</h2>
<sc-for list="{{upcoming}}" as="u" hint-placeholder-count="2">
<button onClick="{{u.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; min-height: 56px; border: none; background: #FFFFFF; border-radius: 18px; color: #17142A; text-align: left">
<span style="{{u.iconStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{u.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{u.name}}</span><span style="font-size: 13px; color: #5C5670">{{u.meta}}</span></span>
<span style="font-size: 14px; font-weight: 700; color: #4B22E0">{{u.when}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
</div>

<sc-if value="{{stuck}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 41px; background: #FFF6EA; z-index: 4"></div>
</sc-if>

<sc-if value="{{toast.show}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 110px; background: #17142A; color: #FFFFFF; border-radius: 20px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 10px">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #2FD4A7; color: #17142A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{toast.text}}</span>
<button onClick="{{undo}}" style="height: 44px; padding: 0 16px; border-radius: 14px; border: none; background: #FFD23F; color: #17142A; font-size: 15px; font-weight: 700">Undo</button>
</div>
</sc-if>

<nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 28px; height: 68px; background: #17142A; border-radius: 34px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px">
<a href="Main.dc.html" aria-current="page" aria-label="{{ringAria}}" style="background: #FFD23F; color: #17142A; height: 48px; padding: 0 18px 0 12px; border-radius: 24px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="rgba(23,20,42,0.18)" stroke-width="3.5"></circle><circle cx="12" cy="12" r="8" fill="none" stroke="#17142A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{ringDash}}" transform="rotate(-90 12 12)"></circle></svg>
Today</a>
<a href="Detail.dc.html" style="color: #D9D4EA; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; text-decoration: none">History</a>
<button onClick="{{openSheet}}" aria-label="Add checks" style="border: none; background: #6B3BFF; color: #FFFFFF; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</nav>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(23,20,42,0.55); display: flex; flex-direction: column; justify-content: flex-end">
<button onClick="{{closeSheet}}" aria-label="Close" style="flex-grow: 1; border: none; background: transparent"></button>
<div role="dialog" aria-label="Add checks" style="background: #FFF6EA; border-radius: 32px 32px 0 0; padding: 12px 22px 30px; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #B9B2CC"></span>
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">{{sheetTitle}}</h2>
<span style="font-size: 15px; color: #5C5670">Pick as many as you like.</span>
</div>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #EDE6D8; color: #17142A; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div role="group" aria-label="Add to category" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700">Add to</span>
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{sheetCats}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
{{c.label}}
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="8">
<button onClick="{{chip.toggle}}" aria-pressed="{{chip.pressed}}" style="{{chip.style}}">
<sc-if value="{{chip.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
{{chip.label}}
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="custom-check" style="font-size: 14px; font-weight: 700">Something else?</label>
<div style="display: flex; gap: 8px">
<input id="custom-check" type="text" placeholder="e.g. Cat fed" value="{{customText}}" onChange="{{onCustom}}" style="flex-grow: 1; min-width: 0; height: 50px; border-radius: 16px; border: 2px solid #17142A; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #17142A; box-sizing: border-box">
<button onClick="{{addCustom}}" style="height: 50px; padding: 0 18px; border-radius: 16px; border: none; background: #17142A; color: #FFFFFF; font-size: 15px; font-weight: 700">Add</button>
</div>
</div>

<button onClick="{{commit}}" disabled="{{commitDisabled}}" style="{{commitStyle}}">{{commitLabel}}</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheetOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var ICONS = {
  sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  suitcase: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16',
  home: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6',
  trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
  lock: 'M5 11h14v10H5zM8 11V8a4 4 0 0 1 8 0v3',
  pill: 'M14 4.9a4.6 4.6 0 0 1 6.5 6.5l-9.1 9.1a4.6 4.6 0 0 1-6.5-6.5zM9.6 9.6l4.8 4.8',
  flame: 'M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.2 3 2.5 3.5C11.5 9 11 6 12 3z',
  plug: 'M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4',
  car: 'M5 16h14v-4l-2-5H7l-2 5zM5 12h14M7 19v-3M17 19v-3',
  key: 'M8 11a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM10.8 12.2L20 3M17 6l3 3M14.5 8.5l2 2',
  heart: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
  globe: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
  check: 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17zM8 12.3l2.8 2.8 5.4-5.5'
};
var FG = { '#6B3BFF': '#FFFFFF', '#FFD23F': '#17142A', '#FF7A59': '#17142A', '#2FD4A7': '#17142A', '#5BC0FF': '#17142A', '#FF8AD8': '#17142A' };
var SUB = { '#6B3BFF': '#E3DAFF', '#FFD23F': '#4A3F10', '#FF7A59': '#3D1A10', '#2FD4A7': '#0F3D31', '#5BC0FF': '#0E3550', '#FF8AD8': '#4D1640' };
var TILE = ['#6B3BFF', '#FFD23F', '#FF7A59', '#2FD4A7', '#5BC0FF', '#FF8AD8'];
var WK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var DAY = 86400000;
var TODAY = Date.UTC(2026, 9, 30);
function isoOf(t) { return new Date(t).toISOString().slice(0, 10); }
function fmt(t) { var d = new Date(t); return WK[d.getUTCDay()] + ', ' + MO[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
function ord(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function isDue(c, t) {
  var d = new Date(t);
  if (c.repeat === 'daily') return true;
  if (c.repeat === 'weekly') return d.getUTCDay() === c.weekday;
  if (c.repeat === 'biweekly') return d.getUTCDay() === c.weekday && Math.floor(Math.round((t - Date.parse(c.anchor)) / DAY) / 7) % 2 === 0;
  if (c.repeat === 'monthly') return d.getUTCDate() === c.day;
  if (c.repeat === 'yearly') return d.getUTCMonth() === c.month && d.getUTCDate() === c.day;
  if (c.repeat === 'date') return isoOf(t) === c.date;
  return false;
}
function repeatLabel(c) {
  if (c.repeat === 'daily') return 'Every day';
  if (c.repeat === 'weekly') return 'Every ' + WK[c.weekday];
  if (c.repeat === 'biweekly') return 'Every other ' + WK[c.weekday];
  if (c.repeat === 'monthly') return 'Monthly on the ' + ord(c.day);
  if (c.repeat === 'yearly') return 'Every year, ' + MO[c.month] + ' ' + c.day;
  if (c.repeat === 'date') return 'Once · ' + fmt(Date.parse(c.date));
  return '';
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var t = isoOf(TODAY);
    var done = {};
    done[t + '|door'] = { time: '8:42 AM', ago: '2h ago · photo', photo: true };
    done[t + '|pill'] = { time: '8:15 AM', ago: '2h 27m ago' };
    done[t + '|stove'] = { time: '8:30 AM', ago: '2h 12m ago' };
    done[t + '|bins'] = { time: '7:05 AM', ago: '3h 37m ago' };
    this.state = {
      sel: TODAY,
      filter: 'all',
      cats: [
        { id: 'daily', name: 'Daily', icon: 'sun', color: '#6B3BFF', repeat: 'daily' },
        { id: 'bins', name: 'Bin night', icon: 'trash', color: '#2FD4A7', repeat: 'weekly', weekday: 5 },
        { id: 'home', name: 'Home safety', icon: 'home', color: '#FF7A59', repeat: 'monthly', day: 1 },
        { id: 'travel', name: 'Travel', icon: 'suitcase', color: '#5BC0FF', repeat: 'date', date: '2026-11-02' }
      ],
      items: [
        { id: 'door', cat: 'daily', label: 'Front door locked', icon: 'lock' },
        { id: 'pill', cat: 'daily', label: 'Pill taken', icon: 'pill' },
        { id: 'stove', cat: 'daily', label: 'Stove off', icon: 'flame' },
        { id: 'plug', cat: 'daily', label: 'Iron unplugged', icon: 'plug' },
        { id: 'bins', cat: 'bins', label: 'Bins out', icon: 'trash' },
        { id: 'recycle', cat: 'bins', label: 'Recycling out', icon: 'check' },
        { id: 'smoke', cat: 'home', label: 'Smoke alarm tested', icon: 'flame' },
        { id: 'extinguisher', cat: 'home', label: 'Extinguisher checked', icon: 'check' },
        { id: 'passport', cat: 'travel', label: 'Passport packed', icon: 'globe' },
        { id: 'charger', cat: 'travel', label: 'Charger packed', icon: 'plug' },
        { id: 'windows', cat: 'travel', label: 'Windows closed', icon: 'home' },
        { id: 'water', cat: 'travel', label: 'Water main off', icon: 'check' }
      ],
      done: done,
      undoSnap: null,
      toastText: '',
      sheetOpen: !!props.sheetOpen,
      sheetCat: 'daily',
      picked: props.sheetOpen ? { 'Windows closed': true, 'Car locked': true, 'Tap off': true } : {},
      customs: [],
      customText: ''
    };
  }
  componentDidUpdate(prev) {
    if (prev.sheetOpen !== this.props.sheetOpen) this.setState({ sheetOpen: !!this.props.sheetOpen });
  }
  componentWillUnmount() { clearTimeout(this.toastTimer); }
  logItem(item, withPhoto) {
    var s = this.state;
    var key = isoOf(TODAY) + '|' + item.id;
    var next = Object.assign({}, s.done);
    next[key] = { time: 'Just now', ago: withPhoto ? 'With photo' : 'Logged · 0s ago', photo: !!withPhoto };
    this.setState({ done: next, undoSnap: s.done, toastText: (withPhoto ? 'Photo saved · ' : 'Logged · ') + item.label });
    var self = this;
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(function () { self.setState({ undoSnap: null }); }, 5000);
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var sel = st.sel;
    var selIso = isoOf(sel);
    var isToday = sel === TODAY;
    var catById = {};
    st.cats.forEach(function (c) { catById[c.id] = c; });

    var strip = [];
    for (var i = 0; i < 7; i++) {
      (function (t) {
        var d = new Date(t);
        var on = t === sel;
        var dots = st.cats.filter(function (c) { return c.repeat !== 'daily' && isDue(c, t); }).slice(0, 3).map(function (c) {
          return { style: 'width: 6px; height: 6px; border-radius: 3px; background: ' + (on ? '#FFFFFF' : c.color) + ';' };
        });
        strip.push({
          wk: t === TODAY ? 'Today' : WK[d.getUTCDay()],
          num: d.getUTCDate(),
          dots: dots,
          pressed: on ? 'true' : 'false',
          aria: fmt(t) + (dots.length ? ', ' + dots.length + ' extra categories due' : ''),
          style: 'height: 72px; border-radius: 18px; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ' + (on ? 'background: #17142A; color: #FFFFFF;' : 'background: #FFFFFF; color: #17142A;'),
          numStyle: 'font-family: \'Bricolage Grotesque\', sans-serif; font-size: 20px; font-weight: 800; color: ' + (on ? '#FFD23F' : (t === TODAY ? '#4B22E0' : '#17142A')) + ';',
          pick: function () { self.setState({ sel: t }); }
        });
      })(TODAY + i * DAY);
    }

    var dueCats = st.cats.filter(function (c) { return isDue(c, sel) && (st.filter === 'all' || st.filter === c.id); });
    var tileIndex = 0;
    var segs = [];
    var total = 0, doneCount = 0, pending = [];
    var sections = dueCats.map(function (c) {
      var catItems = st.items.filter(function (it) { return it.cat === c.id; });
      var secDone = 0;
      var items = catItems.map(function (it) {
        var color = TILE[(tileIndex++) % TILE.length];
        var log = st.done[selIso + '|' + it.id];
        var isDone = !!log;
        total++;
        segs.push({ style: 'flex: 1 1 0; height: 6px; border-radius: 3px; background: ' + (isDone ? color : 'rgba(23,20,42,0.12)') + ';' });
        if (isDone) { doneCount++; secDone++; } else pending.push(it.label);
        var base = 'width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font-family: inherit; ';
        var tileStyle = isDone ? base + 'border: none; background: ' + color + '; color: ' + FG[color] + ';'
          : (isToday ? base + 'border: 2px dashed #17142A; background: transparent; color: #17142A;' : base + 'border: none; background: #FFFFFF; color: #17142A; cursor: default;');
        var chip = FG[color] === '#FFFFFF' ? 'rgba(255,255,255,0.18)' : 'rgba(23,20,42,0.10)';
        var photo = !!(log && log.photo);
        return {
          name: it.label,
          icon: ICONS[it.icon] || ICONS.check,
          done: isDone,
          photo: photo,
          canSnap: isToday,
          time: isDone ? log.time : (isToday ? 'Tap to log' : 'Upcoming'),
          ago: isDone ? log.ago : (isToday ? 'Not yet today' : 'Due ' + fmt(sel)),
          aria: it.label + (isDone ? ', logged ' + log.time + ' — tap to log again' : (isToday ? ', not logged — tap to log' : ', upcoming on ' + fmt(sel))),
          tileStyle: tileStyle,
          short: isDone ? log.time : (isToday ? 'Tap to log' : 'Upcoming'),
          iconStyle: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ' + (isDone ? chip : color) + '; color: ' + (isDone ? FG[color] : FG[color]) + ';',
          subStyle: 'font-size: 12px; font-weight: 700; white-space: nowrap; color: ' + (isDone ? SUB[color] : '#5C5670') + ';',
          camStyle: 'position: relative; width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: ' + (photo ? '#17142A' : (isDone ? chip : 'rgba(23,20,42,0.10)')) + '; color: ' + (photo ? '#FFFFFF' : (isDone ? FG[color] : '#17142A')) + ';',
          photoAria: photo ? 'Retake photo for ' + it.label : 'Log ' + it.label + ' with a photo',
          log: function () { if (isToday) self.logItem(it, false); },
          snap: function () { self.logItem(it, true); }
        };
      });
      return {
        name: c.name,
        icon: ICONS[c.icon] || ICONS.check,
        repeat: repeatLabel(c),
        progress: secDone + '/' + items.length,
        addLabel: 'Add a task to ' + c.name,
        addIconStyle: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ' + c.color + '; color: ' + FG[c.color] + ';',
        add: function () { self.setState({ sheetOpen: true, sheetCat: c.id, picked: {}, customText: '' }); },
        iconStyle: 'width: 40px; height: 40px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + c.color + '; color: ' + FG[c.color] + ';',
        items: items
      };
    });

    var filters = [{ id: 'all', label: 'All' }].concat(st.cats.map(function (c) { return { id: c.id, label: c.name, icon: ICONS[c.icon], color: c.color }; })).map(function (f) {
      var on = st.filter === f.id;
      return {
        label: f.label, hasIcon: !!f.icon, icon: f.icon || '', pressed: on ? 'true' : 'false',
        iconStyle: 'width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: ' + (f.color || '#17142A') + '; color: ' + (FG[f.color] || '#FFFFFF') + ';',
        style: 'flex-shrink: 0; height: 40px; padding: 0 14px 0 ' + (f.icon ? '9px' : '14px') + '; border-radius: 20px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; ' + (on ? 'border: 2px solid #17142A; background: #17142A; color: #FFFFFF;' : 'border: 2px solid #17142A; background: transparent; color: #17142A;'),
        pick: function () { self.setState({ filter: f.id }); }
      };
    });

    var upcoming = [];
    var seen = {};
    for (var k = 1; k <= 31 && upcoming.length < 3; k++) {
      var t2 = TODAY + k * DAY;
      st.cats.forEach(function (c) {
        if (c.repeat === 'daily' || seen[c.id] || upcoming.length >= 3 || t2 === sel) return;
        if (!isDue(c, t2)) return;
        if (isDue(c, sel)) return;
        seen[c.id] = true;
        var n = st.items.filter(function (it) { return it.cat === c.id; }).length;
        var tt = t2;
        upcoming.push({
          name: c.name, icon: ICONS[c.icon], meta: n + ' checks · ' + repeatLabel(c),
          when: k === 1 ? 'Tomorrow' : (k < 7 ? WK[new Date(tt).getUTCDay()] : MO[new Date(tt).getUTCMonth()] + ' ' + new Date(tt).getUTCDate()),
          iconStyle: 'width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + c.color + '; color: ' + FG[c.color] + ';',
          pick: function () { if (tt < TODAY + 7 * DAY) self.setState({ sel: tt, filter: 'all' }); }
        });
      });
    }

    var summary = total === 0 ? '' : (pending.length === 0 ? 'All clear. Nothing to recheck.' : (isToday ? (pending.length === 1 ? '1 left: ' + pending[0] : pending.length + ' left to check') : total + ' checks planned'));
    var filterName = st.filter === 'all' ? '' : (catById[st.filter] ? catById[st.filter].name : '');

    var clear = isToday && total > 0 && pending.length === 0;
    var scope = (filterName || (isToday ? 'Today' : 'All')) + (isToday ? (filterName ? ' · today' : '') : ' · ' + fmt(sel));
    var bar = {
      scope: scope,
      scopeColor: clear ? '#0F3D31' : '#5C5670',
      main: total === 0 ? 'Nothing due' : (isToday ? doneCount + ' of ' + total + ' done' : total + (total === 1 ? ' check planned' : ' checks planned')),
      pill: total === 0 ? 'Free day' : (isToday ? (clear ? 'All clear' : pending.length + ' left') : 'Upcoming'),
      clear: clear,
      hasSegs: total > 0,
      segs: segs,
      style: 'border-radius: 20px; padding: 12px 12px 12px 16px; ' + (clear ? 'background: #2FD4A7; color: #17142A;' : 'background: #FFFFFF; color: #17142A;') + (st.stuck ? ' box-shadow: 0 6px 18px rgba(23,20,42,0.14);' : ''),
      pillStyle: 'flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; font-size: 15px; font-weight: 700; ' + (clear ? 'background: #17142A; color: #FFFFFF;' : (isToday && total > 0 ? 'background: #17142A; color: #FFD23F;' : 'background: #EDE6D8; color: #17142A;'))
    };

    var tDone = 0, tTotal = 0, tIso = isoOf(TODAY);
    st.cats.forEach(function (c) {
      if (!isDue(c, TODAY)) return;
      st.items.forEach(function (it) { if (it.cat === c.id) { tTotal++; if (st.done[tIso + '|' + it.id]) tDone++; } });
    });
    var circ = 50.27;
    var ringLen = tTotal ? (tDone / tTotal) * circ : 0;

    var existing = {};
    st.items.forEach(function (x) { existing[x.label] = true; });
    var suggestions = ['Car locked', 'Tap off', 'Back door locked', 'Hair tool off', 'Lights off', 'Garage shut', 'Heater off', 'Keys packed'];
    var labels = suggestions.filter(function (s) { return !existing[s]; }).concat(st.customs);
    var count = 0;
    var chips = labels.map(function (label) {
      var on = !!st.picked[label];
      if (on) count++;
      return {
        label: label, on: on, pressed: on ? 'true' : 'false',
        style: 'height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; ' + (on ? 'border: 2px solid #17142A; background: #17142A; color: #FFFFFF;' : 'border: 2px solid #17142A; background: transparent; color: #17142A;'),
        toggle: function () { var p = Object.assign({}, self.state.picked); p[label] = !p[label]; self.setState({ picked: p }); }
      };
    });
    var sheetCats = st.cats.map(function (c) {
      var on = st.sheetCat === c.id;
      return {
        label: c.name, icon: ICONS[c.icon], pressed: on ? 'true' : 'false',
        style: 'flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 2px solid ' + (on ? c.color : '#D9D4EA') + '; background: ' + (on ? c.color : '#FFFFFF') + '; color: ' + (on ? FG[c.color] : '#17142A') + ';',
        pick: function () { self.setState({ sheetCat: c.id }); }
      };
    });

    return {
      dateLabel: isToday ? 'Today · ' + fmt(sel) : fmt(sel),
      bar: bar,
      barWrapStyle: 'position: sticky; top: 40px; z-index: 3; background: #FFF6EA; padding: 14px 20px 10px;',
      stuck: !!st.stuck,
      sentinelRef: function (el) { self.sentinel = el; },
      onScroll: function (e) {
        var top = self.sentinel ? self.sentinel.offsetTop : 300;
        var stuck = e.currentTarget.scrollTop > top - 40;
        if (stuck !== !!self.state.stuck) self.setState({ stuck: stuck });
      },
      ringDash: ringLen.toFixed(2) + ' ' + circ,
      ringAria: 'Today: ' + tDone + ' of ' + tTotal + ' checked',
      countLabel: isToday ? doneCount + ' of ' + total + ' today' : total + ' due',
      summary: summary,
      strip: strip,
      filters: filters,
      sections: sections,
      isEmpty: sections.length === 0,
      emptyText: filterName ? filterName + ' isn’t due on ' + fmt(sel) + '. Check Coming up below.' : 'No checks scheduled for ' + fmt(sel) + '.',
      upcoming: upcoming,
      hasUpcoming: upcoming.length > 0,
      toast: { show: !!st.undoSnap, text: st.toastText },
      undo: function () {
        if (!self.state.undoSnap) return;
        clearTimeout(self.toastTimer);
        self.setState({ done: self.state.undoSnap, undoSnap: null });
      },
      sheetOpen: st.sheetOpen,
      sheetTitle: catById[st.sheetCat] ? 'Add to ' + catById[st.sheetCat].name : 'Add tasks',
      sheetCats: sheetCats,
      chips: chips,
      customText: st.customText,
      commitDisabled: count === 0,
      commitLabel: count === 0 ? 'Pick at least one' : 'Add ' + count + (count === 1 ? ' task' : ' tasks') + ' to ' + (catById[st.sheetCat] ? catById[st.sheetCat].name : ''),
      commitStyle: 'height: 60px; border-radius: 30px; border: none; font-size: 17px; font-weight: 700; ' + (count === 0 ? 'background: #EDE6D8; color: #5C5670;' : 'background: #6B3BFF; color: #FFFFFF;'),
      openSheet: function () { self.setState({ sheetOpen: true, sheetCat: self.state.filter !== 'all' ? self.state.filter : 'daily' }); },
      closeSheet: function () { self.setState({ sheetOpen: false, picked: {}, customText: '' }); },
      onCustom: function (e) { self.setState({ customText: e.target.value }); },
      addCustom: function () {
        var tx = (self.state.customText || '').trim();
        if (!tx) return;
        var p = Object.assign({}, self.state.picked); p[tx] = true;
        var c = self.state.customs.indexOf(tx) === -1 ? self.state.customs.concat([tx]) : self.state.customs;
        self.setState({ customs: c, picked: p, customText: '' });
      },
      commit: function () {
        var s = self.state;
        var add = Object.keys(s.picked).filter(function (k2) { return s.picked[k2]; }).map(function (k2, n) {
          return { id: 'c' + Date.now() + '-' + n, cat: s.sheetCat, label: k2, icon: 'check' };
        });
        self.setState({ items: s.items.concat(add), sheetOpen: false, picked: {}, customText: '' });
      }
    };
  }
}
</script>
</body>
</html>
